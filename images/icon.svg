<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13294a"/><stop offset="1" stop-color="#070f1c"/>
    </linearGradient>
    <clipPath id="hdr"><rect x="44" y="58" width="168" height="40" rx="14"/></clipPath>
    <pattern id="chk" width="20" height="20" patternUnits="userSpaceOnUse" x="44" y="58">
      <rect width="20" height="20" fill="#f4f7fb"/><rect width="10" height="10" fill="#0b1626"/><rect x="10" y="10" width="10" height="10" fill="#0b1626"/>
    </pattern>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- calendar body -->
  <rect x="44" y="58" width="168" height="150" rx="18" fill="#eef3fb"/>
  <!-- checkered header -->
  <g clip-path="url(#hdr)"><rect x="44" y="58" width="168" height="40" fill="url(#chk)"/><rect x="44" y="84" width="168" height="14" fill="url(#chk)"/></g>
  <rect x="44" y="94" width="168" height="4" fill="#0b1626" opacity=".85"/>
  <!-- binder rings -->
  <rect x="80" y="40" width="14" height="34" rx="7" fill="#c9d3e3" stroke="#0b1626" stroke-width="4"/>
  <rect x="162" y="40" width="14" height="34" rx="7" fill="#c9d3e3" stroke="#0b1626" stroke-width="4"/>
  <!-- racing stripes / speed chevrons -->
  <path d="M70 186 L118 120 L146 120 L98 186 Z" fill="#e10600"/>
  <path d="M112 186 L160 120 L188 120 L140 186 Z" fill="#0090d0"/>
  <!-- speed lines -->
  <rect x="62" y="132" width="34" height="7" rx="3.5" fill="#9fb0c8"/>
  <rect x="56" y="150" width="28" height="7" rx="3.5" fill="#9fb0c8"/>
  <rect x="62" y="168" width="20" height="7" rx="3.5" fill="#9fb0c8"/>
</svg>
